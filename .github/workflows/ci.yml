# The same commands as on your machine (README, "Develop"): format and lint, and every TypeScript
# project type-checked whole; then the hub against the protocol's own conformance suite; then the
# example (examples/): its apps running with their real local database, queues and sign-in, and
# its tests against them, browser tests included.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp check
      - run: vp run check:types
      # Each app's local .env (the hub's HUB_TOKEN, which its tests send) and database.
      - run: vp run setup
      - run: vp run test:conformance
      - run: vp run install:browser
      - run: vp run test:dev
