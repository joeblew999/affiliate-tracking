packages:
  - apps/*

allowBuilds:
  # The Stripe CLI's binary comes in its per-platform package; its install script only downloads
  # it from GitHub when that package is missing.
  "@stripe/cli": false
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

# vp manages Node (.node-version) and pnpm (package.json); stop pnpm from switching versions itself.
runtimeOnFail: ignore
pmOnFail: ignore

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# One version each for both apps. Void 1.11.0 (released 2026-11-19); the rest as joeblew999/void-fbtee
# pins them (its pnpm-workspace.yaml, read 2026-11-22), with Vite+ 1.6.0, which that repo found
# Vite+ 1.7.0 breaks.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitest: 5.1.0
  void: 1.11.0
  "@void/react": 1.11.0
  "@void/edge": 1.11.0
  devalue: 6.0.3
  "@cloudflare/workers-types": 5.20261117.1
  typescript: 7.0.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  zod: 4.6.7
  # Stripe's typed SDK; 23.2.0 published 2026-11-19, accepted by @better-auth/stripe 1.7.27.
  stripe: 23.2.0
  # The version Void 1.11.0 runs on; apps import its HTTPException.
  hono: 4.13.19
  # Better Auth: the shop's sign-in; the service and the tests take its types.
  better-auth: 1.7.27

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
